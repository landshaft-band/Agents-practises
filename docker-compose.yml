services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-rag-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./storage:/app/storage
      # Для разработки раскомментируйте:
      # - .:/app
    # ports:
    #   - "8443:8443"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - tg-network

networks:
  tg-network:
    driver: bridge